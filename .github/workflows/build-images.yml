name: Build Images
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-cpu:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build CPU image
        uses: docker/build-push-action@v5
        with:
          file: docker/Dockerfile.cpu
          tags: ghcr.io/${{ github.repository }}-server:${{ github.ref_name }}-cpu
          build-args: HF_TOKEN=${{ secrets.HF_TOKEN }}
          push: false
          load: true
      - name: Smoke test
        run: bash docker/smoke_test.sh ghcr.io/${{ github.repository }}-server:${{ github.ref_name }}-cpu
      - name: Push
        if: success()
        run: docker push ghcr.io/${{ github.repository }}-server:${{ github.ref_name }}-cpu

  build-gpu:
    # Note: requires a self-hosted runner with GPU + nvidia-container-toolkit.
    # Falls back to manual-only (workflow_dispatch) so the default push/tag
    # triggers don't queue a job that has no runner. If no GPU runner is
    # registered, the job will sit in queue -- cancel and run build-cpu only.
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, gpu]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build GPU image
        uses: docker/build-push-action@v5
        with:
          file: docker/Dockerfile.gpu
          tags: ghcr.io/${{ github.repository }}-server:${{ github.ref_name }}-gpu
          build-args: HF_TOKEN=${{ secrets.HF_TOKEN }}
          push: true
