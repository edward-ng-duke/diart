<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8"><title>Diart · 实时声纹 + ASR</title>
<style>
 body{font:14px/1.5 system-ui;margin:0;background:#0b0d10;color:#e6e8eb}
 .wrap{max-width:900px;margin:0 auto;padding:20px}
 button{background:#6366f1;color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer}
 button:disabled{opacity:.5}
 select,input{background:#1a1e25;color:#e6e8eb;border:1px solid #262b33;border-radius:6px;padding:6px}
 .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
 .line{padding:6px 10px;border-left:3px solid #6366f1;margin:4px 0;background:#14171c;border-radius:4px}
 .name{color:#10b981;font-weight:600} .unk{color:#8b929c} .t{color:#8b929c;font-size:12px}
 .line.partial{opacity:.55;font-style:italic;border-left-color:#8b929c}
 .badge{display:inline-block;margin-left:6px;padding:0 5px;border-radius:3px;font-size:11px;background:#7c2d12;color:#fed7aa}
</style></head>
<body><div class="wrap">
 <h2>实时声纹 + ASR</h2>
 <div class="row">
   embedding: <select id="emb"></select>
   segmentation: <select id="seg"></select>
 </div>
 <div class="row">
   <input id="enrollName" placeholder="注册姓名">
   <button id="enrollBtn">录 6 秒并注册</button>
   <span id="enrollStatus" class="t"></span>
 </div>
 <div class="row">
   <button id="startBtn">开始</button>
   <button id="stopBtn" disabled>停止</button>
   <span id="status" class="t">idle</span>
 </div>
 <div id="timeline"></div>
</div>
<script>
const $=s=>document.querySelector(s);
let ws, audioCtx, node, stream, running=false;
let enrolling=false, enrollBuf=[];
const ENROLL_MS = 6000;
// Enrollment and live identification MUST share this exact capture channel
// (docs/bugs/2026-08-05-enroll-channel-mismatch.md): browser DSP off, one
// getUserMedia call site, raw PCM on the wire, torchaudio resamples server-side.
const MIC = {channelCount:1, echoCancellation:false, noiseSuppression:false, autoGainControl:false};

async function loadModels(){
  const info = await (await fetch('/v1/info')).json();
  const emb=$('#emb'), seg=$('#seg');
  const vpReady = Array.isArray(info.voiceprint_ready) ? new Set(info.voiceprint_ready) : null;
  for(const [name,kind] of Object.entries(info.models)){
    if(name.includes('titanet')) continue; // hidden: needs nemo (belt-and-braces)
    if(kind==='embedding' && vpReady && !vpReady.has(name)) continue; // no cohort -> no voiceprint -> hide
    const o=document.createElement('option'); o.value=name; o.textContent=name;
    (kind==='embedding'?emb:seg).appendChild(o);
  }
  const embOpts = [...emb.options].map(o=>o.value);
  emb.value = embOpts.find(v=>v==='pyannote/wespeaker-voxceleb-resnet34-LM')
           || embOpts.find(v=>v==='pyannote/embedding')
           || emb.value;
  seg.value = [...seg.options].find(o=>o.value.includes('segmentation-3.0'))?.value || seg.value;
}

function downsampleSend(buf){
  if(enrolling) return;
  // send float32 LE mono at native rate; server resamples to 16k
  if(ws && ws.readyState===1) ws.send(buf.buffer);
}

// Single frame router: enrollment captures raw frames, live streams them.
function onMicFrame(f){ if(enrolling){ enrollBuf.push(f); return; } downsampleSend(f); }

// The ONE capture call site: both live and enrollment go through here.
async function openMic(){
  stream = await navigator.mediaDevices.getUserMedia({audio:MIC});
  const src = audioCtx.createMediaStreamSource(stream);
  const proc = audioCtx.createScriptProcessor(8192,1,1); // ~0.18s @48k
  proc.onaudioprocess = e => onMicFrame(new Float32Array(e.inputBuffer.getChannelData(0)));
  src.connect(proc); proc.connect(audioCtx.destination);
  node = proc;
}

function teardownCapture(){
  if(node){ node.disconnect(); node=null; }
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  if(audioCtx){ audioCtx.close(); audioCtx=null; }
}

function setSelectsDisabled(d){ $('#emb').disabled=d; $('#seg').disabled=d; }

const turnLines = new Map(); // turn_id -> <div> for partial->final replacement
// Neutral label for every line the server did NOT confirm on this turn
// (docs/superpowers/plans/2026-08-06-voiceprint-selection-plan.md §3 ⑤).
function neutralLabel(speaker){
  const n = /(\d+)\s*$/.exec(speaker || '');
  return n ? `说话人 ${Number(n[1]) + 1}` : '说话人';
}
function lineHTML(m){
  let who, sc='';
  if(m.name){
    who = `<span class="name">${m.name}</span>`;
    if(m.score!=null) sc = ` (${m.score.toFixed(2)})`;
  } else {
    // No confirmed name -> nothing but the neutral label: no guessed name, no
    // score. The old approximate-name hint (this turn's below-gate candidate,
    // or the label's last verified name) fired on 100% of unregistered-speaker
    // turns and was 0% correct — the one structural failure source for
    // acceptance criterion V3 (plan §2/§3 ⑤). Note the server still ships
    // `score` with `name=null` (session.py:721), so it must be dropped here.
    who = `<span class="unk">${neutralLabel(m.speaker)}</span>`;
  }
  const ov = m.overlapped ? ` <span class="badge">⑂重叠</span>` : '';
  return `<span class="t">${m.start.toFixed(1)}–${m.end.toFixed(1)}s</span> ${who}${sc}: ${m.text}${ov}`;
}
function addLine(m){
  const tid = m.turn_id || '';
  // Existing line for this turn_id? Replace its content in place (partial->final).
  if(tid && turnLines.has(tid)){
    const div = turnLines.get(tid);
    // Partial and final ASR for the same turn run as concurrent coroutines, so a
    // stale partial can resolve after the final — never let it clobber a final line.
    if(m.partial && !div.classList.contains('partial')) return;
    div.className = 'line' + (m.partial ? ' partial' : '');
    div.innerHTML = lineHTML(m);
    return;
  }
  const div=document.createElement('div');
  div.className = 'line' + (m.partial ? ' partial' : '');
  div.innerHTML = lineHTML(m);
  $('#timeline').prepend(div);
  // Track any turn_id (partial or final) so later re-emits (partial->final, or
  // BUG3 fragment absorption re-emitting a final) replace in place.
  if(tid) turnLines.set(tid, div);
}

$('#startBtn').onclick = async ()=>{
  $('#startBtn').disabled=true; $('#stopBtn').disabled=false; running=true;
  setSelectsDisabled(true);
  // WebSocket BEFORE mic: the mic only opens once the server says 'ready',
  // so no early frame is dropped by the ws.readyState guard.
  audioCtx = new AudioContext();
  const q = new URLSearchParams({sample_rate:String(audioCtx.sampleRate), embedding_model:$('#emb').value, segmentation_model:$('#seg').value});
  const wsScheme = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${wsScheme}://${location.host}/v1/diarize/stream?${q}`);
  ws.binaryType='arraybuffer';
  let ready=false;
  ws.onmessage = async ev=>{
    const m=JSON.parse(ev.data);
    if(m.type==='ready'){
      $('#status').textContent='listening · '+m.session_id.slice(0,8);
      if(!ready){ ready=true; await openMic(); }
    }
    else if(m.type==='transcript') addLine(m);
    else if(m.type==='error') $('#status').textContent='error: '+m.message;
  };
  const failBeforeReady = why=>{
    if(ready || !running) return;
    running=false;
    teardownCapture();
    $('#startBtn').disabled=false; $('#stopBtn').disabled=true;
    if(!enrolling) setSelectsDisabled(false);
    $('#status').textContent=why;
  };
  ws.onerror = ()=>failBeforeReady('error: websocket');
  ws.onclose = ()=>failBeforeReady('closed before ready');
};

$('#stopBtn').onclick = ()=>{
  running=false; $('#startBtn').disabled=false; $('#stopBtn').disabled=true;
  if(ws && ws.readyState===1) ws.send(JSON.stringify({type:'end'}));
  teardownCapture();
  if(!enrolling) setSelectsDisabled(false);
  $('#status').textContent='stopped';
};

$('#enrollBtn').onclick = async ()=>{
  const name=$('#enrollName').value.trim(); if(!name){$('#enrollStatus').textContent='填姓名';return;}
  if(enrolling) return;
  // Reuse the live capture when running; otherwise open our own (same channel).
  let ownCapture=false;
  if(!running){ audioCtx = new AudioContext(); await openMic(); ownCapture=true; }
  enrollBuf=[]; enrolling=true; // onMicFrame now buffers; nothing reaches the live WS
  $('#enrollBtn').disabled=true; $('#startBtn').disabled=true; $('#stopBtn').disabled=true;
  setSelectsDisabled(true);
  let left = ENROLL_MS/1000;
  $('#enrollStatus').textContent='录音中… 剩 '+left+'s';
  const tick = setInterval(()=>{ left--; if(left>=1) $('#enrollStatus').textContent='录音中… 剩 '+left+'s'; }, 1000);
  await new Promise(res=>setTimeout(res, ENROLL_MS));
  clearInterval(tick);
  enrolling=false; // live frames resume
  const total = enrollBuf.reduce((a,b)=>a+b.length, 0);
  const f32 = new Float32Array(total);
  let off=0; for(const b of enrollBuf){ f32.set(b, off); off+=b.length; }
  enrollBuf=[];
  // Raw PCM at the NATIVE rate: the server resamples with torchaudio,
  // the same resampler family every live identification frame goes through.
  const wav = encodeWav(f32, audioCtx.sampleRate);
  if(ownCapture) teardownCapture();
  const fd = new FormData();
  fd.append('name', name); fd.append('embedding_model', $('#emb').value);
  fd.append('file', new Blob([wav],{type:'audio/wav'}), 'enroll.wav');
  try{
    const r = await fetch('/v1/voiceprints', {method:'POST', body:fd});
    if(r.ok){
      const j = await r.json();
      $('#enrollStatus').textContent = '已注册 '+name+'（第'+j.n_clips+'条）— 再录1-2条更稳';
    }else{
      let detail=''; try{ detail=(await r.json()).detail||''; }catch(e){}
      $('#enrollStatus').textContent = '注册失败 '+r.status+(detail?('：'+detail):'');
    }
  }catch(e){
    $('#enrollStatus').textContent = '注册失败 '+e;
  }
  $('#enrollBtn').disabled=false;
  if(running){ $('#stopBtn').disabled=false; }
  else { $('#startBtn').disabled=false; setSelectsDisabled(false); }
};

function encodeWav(f32, sr){
  const buf=new ArrayBuffer(44+f32.length*2), v=new DataView(buf);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF'); v.setUint32(4,36+f32.length*2,true); w(8,'WAVE'); w(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  w(36,'data'); v.setUint32(40,f32.length*2,true);
  let o=44; for(let i=0;i<f32.length;i++,o+=2){const s=Math.max(-1,Math.min(1,f32[i]));v.setInt16(o,s*0x7fff,true);}
  return buf;
}

loadModels();
</script>
</body></html>
